<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>FlipSheet Notifications</title><meta name="description" content="Enable FlipSheet browser notifications for recurring automation results."><style>body{margin:0;background:#090b10;color:#f5f6f8;font:15px system-ui}.box{max-width:620px;margin:10vh auto;padding:28px;background:#12151c;border:1px solid #292e38;border-radius:22px;animation:rise .35s ease both}.pill{border:0;border-radius:999px;padding:12px 18px;background:#7657ff;color:#fff;font-weight:800;cursor:pointer;transition:transform .16s ease,box-shadow .16s ease,opacity .16s ease}.pill:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 10px 25px #0005}.pill:active:not(:disabled){transform:scale(.98)}.pill:disabled{opacity:.55;cursor:wait}.muted{color:#9ca4b2}#msg{margin-top:14px;padding:10px 12px;border-radius:12px;background:#171b24;transition:opacity .2s ease,transform .2s ease}#msg.ok{border:1px solid #2a6248}#msg.bad{border:1px solid #68323b}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}</style></head><body><div class="box"><h1>FlipSheet notifications</h1><p class="muted">Enable browser notifications to hear when a scheduled spreadsheet automation completes or needs attention.</p><button id="enable" class="pill">Enable notifications</button><button id="disable" class="pill" style="display:none;background:#24171b;border:1px solid #5d3038;margin-left:8px">Disable</button><div id="msg"></div></div><script type="module">import{auth,googleProvider,signInWithPopup,messagingPromise,getToken,analyticsPromise}from'/firebase.js';const el=id=>document.getElementById(id),msg=(t,ok)=>{el('msg').textContent=t;el('msg').className=ok===undefined?'':(ok?'ok':'bad')};const buttons=[el('enable'),el('disable')];let savedToken=localStorage.getItem('flipsheet_fcm_token')||'';if(savedToken)el('disable').style.display='inline-block';function busy(v,active){buttons.forEach(b=>{b.disabled=v;b.textContent=v&&b===active?'Working…':(b.id==='enable'?'Enable notifications':'Disable');});}async function json(r){const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Request failed.');return j;}el('enable').onclick=async()=>{if(el('enable').disabled)return;busy(true,el('enable'));msg('Preparing browser notifications…');try{const c=await fetch('/api/config').then(json);if(!c.notificationsEnabled)throw Error('Notifications are not configured yet.');const cred=await signInWithPopup(auth,googleProvider);await analyticsPromise;const permission=await Notification.requestPermission();if(permission!=='granted')throw Error('Browser notification permission was not granted.');const messaging=await messagingPromise;if(!messaging)throw Error('This browser does not support web notifications.');const token=await getToken(messaging,{vapidKey:c.vapidKey});const idToken=await cred.user.getIdToken();await fetch('/api/push/register',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+idToken},body:JSON.stringify({token,userAgent:navigator.userAgent})}).then(json);savedToken=token;localStorage.setItem('flipsheet_fcm_token',token);el('disable').style.display='inline-block';msg('Notifications are enabled for this browser.',true);}catch(e){msg(e.message||'Could not enable notifications.',false);}finally{busy(false);}};el('disable').onclick=async()=>{if(el('disable').disabled)return;busy(true,el('disable'));msg('Disabling notifications…');try{const cred=await signInWithPopup(auth,googleProvider);await analyticsPromise;const idToken=await cred.user.getIdToken();if(savedToken)await fetch('/api/push/unregister',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+idToken},body:JSON.stringify({token:savedToken})}).then(json);localStorage.removeItem('flipsheet_fcm_token');savedToken='';msg('Notifications are disabled for this browser.',true);el('disable').style.display='none';}catch(e){msg(e.message||'Could not disable notifications.',false);}finally{busy(false);}};</script></body></html>
