<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>FlipSheet Billing Status</title><link rel="icon" href="/assets/icon-128.png"><style>body{margin:0;background:#090b10;color:#f5f6f8;font:15px/1.5 system-ui}.box{width:min(560px,calc(100% - 36px));margin:12vh auto;padding:28px;background:#12151c;border:1px solid #292f3a;border-radius:24px;text-align:center}.icon{width:60px;height:60px;border-radius:18px;display:block;object-fit:cover;margin:0 auto 18px}.muted{color:#9ca4b2}.pill{display:inline-block;margin-top:18px;border-radius:999px;padding:12px 18px;background:#7657ff;color:#fff;text-decoration:none;font-weight:800}</style></head><body><div class="box"><img class="icon" src="/assets/logo-mark.svg" alt="FlipSheet mark"><h1 id="title">Checking payment…</h1><p id="msg" class="muted">We are confirming your payment with Flutterwave.</p><a class="pill" href="/" style="display:none" id="home">Return to FlipSheet</a></div><script>const token=new URLSearchParams(location.search).get('token');const title=document.getElementById('title'),msg=document.getElementById('msg'),home=document.getElementById('home');async function run(){if(!token){title.textContent='Invalid checkout';msg.textContent='Return to FlipSheet and start checkout again.';home.style.display='inline-block';return}for(let i=0;i<30;i++){try{const r=await fetch('/api/billing/status?token='+encodeURIComponent(token));const j=await r.json();if(j.active){title.textContent='Pro is active';msg.textContent='Your FlipSheet subscription is active. Return to Google Sheets and continue working.';home.style.display='inline-block';return}if(j.status==='past_due'||j.status==='cancelled'){title.textContent='Payment not completed';msg.textContent='No Pro access was activated. Return to FlipSheet and try again.';home.style.display='inline-block';return}}catch(_){}await new Promise(r=>setTimeout(r,2000))}title.textContent='Still confirming';msg.textContent='The payment may still be processing. Return to FlipSheet and reopen it shortly.';home.style.display='inline-block'}run();</script></body></html>
