<!doctype html>
<html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#0d0f14;--panel:#151820;--panel2:#1b1f29;--text:#f7f8fb;--muted:#9ca5b5;--accent:#7657ff;--line:#292f3b;--ok:#49d58b;--bad:#ff7180}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--text);font:13px/1.5 Arial,sans-serif;overflow:auto}main{padding:14px 14px 28px;max-width:520px;margin:auto}.brand{display:flex;align-items:center;gap:10px;margin-bottom:12px}.logo{width:36px;height:36px;display:block;flex:0 0 auto;filter:drop-shadow(0 6px 12px #0006)}.brand b{font-size:17px}.brand span{display:block;color:var(--muted);font-size:11px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px}.eyebrow{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.12em}.status{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:5px}.pill{border:1px solid var(--line);border-radius:999px;padding:8px 12px;color:#fff;background:#222734;cursor:pointer;font-weight:700}.pill.primary{background:var(--accent);border-color:var(--accent)}.pill:disabled{opacity:.55;cursor:default}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tool{min-height:70px;text-align:left}.tool strong{display:block}.tool small{display:block;color:var(--muted);margin-top:3px}.field,select{width:100%;background:#0e1117;border:1px solid var(--line);color:var(--text);border-radius:11px;padding:9px;margin-top:7px}.row{display:flex;gap:7px}.row>*{flex:1}.msg{padding:9px 10px;border-radius:11px;background:var(--panel2);margin:9px 0;color:#dbe0e9}.msg.ok{border:1px solid #2a6248}.msg.bad{border:1px solid #68323b}.list{display:flex;flex-direction:column;gap:7px;margin-top:9px}.item{padding:9px;border:1px solid var(--line);border-radius:12px}.item b{display:block}.muted{color:var(--muted)}.check{display:flex;gap:7px;align-items:center;margin-top:9px;color:#cbd1db}.footer{color:#6f7786;text-align:center;font-size:10px;padding:10px}a{color:#b9adff;text-decoration:none}details summary{cursor:pointer;list-style:none;font-weight:800}details summary::-webkit-details-marker{display:none}.summary{display:flex;justify-content:space-between;align-items:center}.chev{color:var(--muted)}.danger{border-color:#5d3038;color:#ff9aa5;background:#24171b}.success{color:var(--ok)}
.toast{position:fixed;left:14px;right:14px;top:12px;z-index:20;display:flex;align-items:center;gap:9px;padding:11px 13px;border:1px solid #2a6248;border-radius:14px;background:rgba(25,42,34,.97);box-shadow:0 14px 40px #0008;transform:translateY(-18px);opacity:0;pointer-events:none;transition:opacity .22s ease,transform .22s ease}.toast.show{opacity:1;transform:translateY(0)}.toast.bad{border-color:#68323b;background:rgba(52,27,32,.97)}.toast span:first-child{width:23px;height:23px;border-radius:50%;display:grid;place-items:center;background:var(--ok);color:#08120d;font-weight:900;flex:0 0 auto}.toast.bad span:first-child{background:var(--bad);color:#21080d}.pill{transition:transform .16s ease,box-shadow .16s ease,background .16s ease}.pill:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 8px 22px #0005}.pill:active:not(:disabled){transform:translateY(0) scale(.98)}.pill.loading{position:relative;padding-right:34px}.pill.loading:after{content:"";position:absolute;right:12px;top:50%;width:12px;height:12px;margin-top:-7px;border:2px solid #ffffff55;border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}details.card{transition:border-color .2s ease,box-shadow .2s ease}details.card[open]{border-color:#39304f;box-shadow:0 10px 30px #0003}.item{animation:rise .22s ease both}@keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style></head><body><main>
<div class="brand"><svg class="logo" viewBox="0 0 512 512" aria-label="FlipSheet"><defs><linearGradient id="sb" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1768ff"/><stop offset=".55" stop-color="#20c7f2"/><stop offset="1" stop-color="#55e9d0"/></linearGradient><linearGradient id="sg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c9b67"/><stop offset=".55" stop-color="#34dc79"/><stop offset="1" stop-color="#b7f45b"/></linearGradient></defs><path d="M111 291c0-52 18-97 54-133 31-31 72-51 122-59l103-17-20 72-91 15c-28 5-51 16-69 33-21 20-34 45-38 75l-7 54z" fill="url(#sb)"/><path d="M199 342c-3-34 6-66 27-91 18-21 41-34 70-40l91-17-19 69-63 14c-17 4-31 12-41 25-12 15-17 31-15 48z" fill="url(#sg)"/><path d="M178 350l13-101c2-15 15-28 30-31l71-13-18 72-47 11-10 79z" fill="#062e30"/><g fill="#a3f58b"><rect x="191" y="268" width="23" height="18" rx="4" transform="rotate(-7 191 268)"/><rect x="222" y="264" width="23" height="18" rx="4" transform="rotate(-7 222 264)"/><rect x="253" y="260" width="23" height="18" rx="4" transform="rotate(-7 253 260)"/><rect x="187" y="296" width="23" height="18" rx="4" transform="rotate(-7 187 296)"/><rect x="218" y="292" width="23" height="18" rx="4" transform="rotate(-7 218 292)"/><rect x="249" y="288" width="23" height="18" rx="4" transform="rotate(-7 249 288)"/><rect x="183" y="324" width="23" height="18" rx="4" transform="rotate(-7 183 324)"/><rect x="214" y="320" width="23" height="18" rx="4" transform="rotate(-7 214 320)"/><rect x="245" y="316" width="23" height="18" rx="4" transform="rotate(-7 245 316)"/></g></svg><div><b>FlipSheet</b><span>Clean, repair & automate</span></div></div>
<div class="card"><div class="eyebrow">Selected range</div><div id="ctx" class="muted">Loading…</div><div id="message"></div></div><div id="toast" class="toast" role="status" aria-live="polite"><span id="toastIcon">✓</span><span id="toastText"></span></div>
<div class="grid">
<button class="pill tool primary" onclick="act(this,'analyzeSelected')"><strong>◉ Analyze</strong><small>Find issues before changing data</small></button>
<button class="pill tool" onclick="act(this,'cleanSelected')"><strong>✦ Clean</strong><small>Safely fix whitespace in text</small></button>
</div>
<details class="card" style="margin-top:10px"><summary><span class="summary"><span>More tools</span><span class="chev">⌄</span></span></summary><div style="height:8px"></div><div class="grid">
<button class="pill tool" onclick="act(this,'removeDuplicatesSelected')"><strong>♻ Duplicates</strong><small>Remove repeated rows safely</small></button>
<button class="pill tool" onclick="act(this,'validateEmailsSelected')"><strong>✉ Email check</strong><small>Find malformed email-like values</small></button>
<button class="pill tool" onclick="act(this,'standardizeSelected')"><strong>Aa Standardize</strong><small>Normalize text spacing</small></button>
</div></details>
<details class="card"><summary><span class="summary"><span>Automations</span><span class="chev">⌄</span></span></summary><div style="height:8px"></div><div class="muted">Run a safe maintenance task every day on this sheet and range.</div><select id="action"><option value="clean">Clean text</option><option value="duplicates">Remove duplicates</option><option value="standardize">Standardize text</option><option value="emails">Validate email-like values</option></select><div class="row"><input id="name" class="field" placeholder="Automation name"><input id="hour" class="field" type="number" min="0" max="23" value="8" title="UTC hour"></div><label class="check"><input id="header" type="checkbox"> First selected row is a header</label><button id="create" class="pill primary" style="width:100%;margin-top:9px" onclick="createAuto()">Create automation</button><div id="autos" class="list"></div></details>
<details class="card"><summary><span class="summary"><span>Plan & billing</span><span class="chev">⌄</span></span></summary><div style="height:8px"></div><div class="status"><b id="plan">Checking…</b><span id="renew" class="muted"></span></div><div id="limits" class="muted" style="margin-top:4px"></div><select id="planChoice"><option value="pro_monthly">Pro · $5 monthly</option><option value="pro_yearly">Pro · $49 yearly</option><option value="pro_ngn_monthly">Pro · ₦7,500 monthly</option><option value="pro_ngn_yearly">Pro · ₦75,000 yearly</option></select><button id="upgrade" class="pill primary" style="width:100%;margin-top:8px" onclick="upgrade()">Upgrade to Pro</button><a id="checkoutLink" class="pill primary" target="_blank" rel="noopener" href="" style="display:none;width:100%;margin-top:8px;text-align:center">Open secure checkout ↗</a><button id="cancel" class="pill danger" style="width:100%;margin-top:8px;display:none" onclick="cancelSub()">Stop future renewals</button></details>
<div class="footer">Sheet data is processed in Google Sheets. Billing is handled securely by FlipSheet + Flutterwave.</div>
</main>
<script>
let busy=false,toastTimer=null;
function show(text,ok=true){const e=document.getElementById('message');e.className='msg '+(ok?'ok':'bad');e.textContent=text;toast(text,ok);}
function toast(text,ok=true){const t=document.getElementById('toast');document.getElementById('toastText').textContent=text;const icon=document.getElementById('toastIcon');icon.textContent=ok?'✓':'!';t.className='toast show '+(ok?'':'bad');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),3500);}
function setBusy(v,active){busy=v;document.querySelectorAll('button').forEach(b=>{b.disabled=v;b.classList.toggle('loading',!!v&&b===active);});}
function server(fn,args,active,working,done){setBusy(true,active);const e=document.getElementById('message');e.className='msg';e.textContent=working;let call=google.script.run.withSuccessHandler(r=>{setBusy(false);show(r.message,!!r.ok);if(done)done(r);refresh();}).withFailureHandler(e=>{setBusy(false);show(e.message||'Action failed. Try again.',false);if(done)done({ok:false});});call[fn].apply(call,args||[]);}
function act(btn,fn){if(busy)return;server(fn,[],btn,'Working…');}
function refresh(){
  google.script.run.withSuccessHandler(c=>{const ctx=document.getElementById('ctx');ctx.textContent=c.error?c.error:(c.sheet+' · '+(c.range||'No selection')+' · '+c.rows+' rows');const p=c.license||{};document.getElementById('plan').textContent=(p.plan||'free').toUpperCase();document.getElementById('limits').textContent=p.offline?'Billing temporarily unavailable; safe basic tools remain available.':(p.expiresAt?'Pro active until '+new Date(p.expiresAt).toLocaleDateString():'Free · 500 rows/action · 2 automations');document.getElementById('cancel').style.display=p.plan==='pro'?'block':'none';document.getElementById('upgrade').style.display=p.plan==='pro'?'none':'block';document.getElementById('renew').textContent=p.cancelAtPeriodEnd&&p.expiresAt?'Renewal stopped · access until '+new Date(p.expiresAt).toLocaleDateString():(p.expiresAt?'Renews around '+new Date(p.expiresAt).toLocaleDateString():'');}).withFailureHandler(e=>show(e.message||'Could not refresh FlipSheet status.',false)).getContext();
  google.script.run.withSuccessHandler(renderAutos).withFailureHandler(e=>show(e.message||'Could not load automations.',false)).listAutomations();
}
function renderAutos(a){a=Array.isArray(a)?a:[];document.getElementById('autos').innerHTML=a.length?a.map((x,i)=>`<div class="item" style="animation-delay:${Math.min(i,8)*35}ms"><b>${esc(x.name)}</b><span class="muted">Daily · ${esc(x.action)} · ${x.hour}:00 UTC</span>${x.lastRunAt?`<br><span class="muted">Last run: ${new Date(x.lastRunAt).toLocaleString()}</span>`:''}${x.lastResult&&x.lastResult.error?`<br><span style="color:#ff9aa5">Needs attention: ${esc(x.lastResult.error)}</span>`:''}${!x.triggerActive?`<br><span style="color:#ff9aa5">Scheduled trigger is missing.</span><br><button class="pill autoAction" data-action="repair" data-id="${esc(x.id)}">Repair schedule</button> `:''}<button class="pill autoAction" data-action="run" data-id="${esc(x.id)}">Run now</button> <button class="pill autoAction" data-action="delete" data-id="${esc(x.id)}">Remove</button></div>`).join(''):'<span class="muted">No automations yet.</span>';}
document.getElementById('autos').addEventListener('click',e=>{const b=e.target.closest('.autoAction');if(!b||busy)return;const id=b.dataset.id;const action=b.dataset.action;if(action==='repair')repair(id,b);else if(action==='run')runNow(id,b);else if(action==='delete')del(id,b);});
function createAuto(){if(busy)return;const b=document.getElementById('create');server('createAutomation',[document.getElementById('name').value.trim()||'Daily maintenance',document.getElementById('action').value,document.getElementById('hour').value,document.getElementById('header').checked?1:0],b,'Creating daily automation…',r=>{if(r.ok){document.getElementById('name').value='';}});}
function del(id,btn){if(busy)return;if(!confirm('Remove this daily automation? Its scheduled trigger will also be deleted.'))return;server('deleteAutomation',[id],btn,'Removing automation…');}
function runNow(id,btn){if(busy)return;server('runAutomationNow',[id],btn,'Running automation…');}
function repair(id,btn){if(busy)return;server('repairAutomation',[id],btn,'Repairing schedule…');}
function upgrade(){if(busy)return;const b=document.getElementById('upgrade');const selected=document.getElementById('planChoice').value;server('startCheckout',[selected],b,'Preparing secure checkout…',r=>{const link=document.getElementById('checkoutLink');if(r.ok&&r.checkoutUrl){link.href=r.checkoutUrl;link.style.display='block';document.getElementById('upgrade').style.display='none';toast('Secure checkout is ready. Tap “Open secure checkout”.');}else{link.style.display='none';}});}
function cancelSub(){if(busy)return;if(!confirm('Stop future recurring charges? Your current Pro access remains until its paid-through date.'))return;server('cancelSubscription',[],document.getElementById('cancel'),'Stopping future renewals…');}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
window.addEventListener('error',e=>{if(e.message)show('FlipSheet encountered an unexpected UI error. Please retry.',false);});
window.addEventListener('unhandledrejection',()=>show('FlipSheet encountered an unexpected action error. Please retry.',false));
refresh();
</script></body></html>
